spring.application.name=MedAssist

# Server
server.port=8080

# Datasource
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Twilio
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER}

# AI Service
ai-service.base-url=${AI_SERVICE_URL}
ai-service.timeout=30000

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Google Calendar Integration (optional)
# Set to true to enable Google Calendar sync
google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
# Calendar ID (use 'primary' for the main calendar)
google.calendar.id=${GOOGLE_CALENDAR_ID:primary}
# Path to Google service account credentials JSON file (optional)
google.calendar.credentials-file=${GOOGLE_CALENDAR_CREDENTIALS_FILE}
# Application name for Google API
google.calendar.application-name=MedAssist

# Application Settings
app.timezone=${APP_TIMEZONE:America/New_York}

# Appointment Settings
appointment.default-duration-minutes=30
appointment.max-advance-booking-days=90
appointment.min-cancellation-hours=2

# Reminder Settings
reminder.day-before.enabled=true
reminder.day-before.time=09:00
reminder.hours-before.enabled=true
reminder.hours-before.value=2

# Logging
logging.level.com.medassist=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
